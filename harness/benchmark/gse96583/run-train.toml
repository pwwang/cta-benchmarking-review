# --------------------------------------------------------------------------
# WHAT   Train-split arm roster for gse96583 (pipeline CellTypeAnnotation_gse96583_train).
# SOURCE harness/benchmark/gse96583/run-train.toml
# --------------------------------------------------------------------------

# simpleconf-loader: liq
name = "CellTypeAnnotation_gse96583_train"

[InputData.in]
infile = "benchmark/gse96583/data/gse96583_train.qs"

{% for m in [
    "ScTypeDBShort", "ScTypeDBFull", "scCATCH", "CellMarker",
    "AutoPos8525", "AutoPos8526", "AutoPos8527", "AutoBoth",
    "ScTypeDBShortPos", "ScTypeDBFullPos", "scCATCHPos", "CellMarkerPos",
    "PanglaoDB"
] %}
[CellTypeAnnotation_Garnett_{{m}}.envs.garnett]
rank_prob_ratio = 1.01
classifier = "MarkerTraining_gse96583-output/GarnettClassifierTrainer_{{m}}/gse96583_train.classifier.RDS"
{% endfor %}

{% for m in [
    "ScTypeDBShort", "ScTypeDBFull", "scCATCH", "CellMarker",
    "AutoPos8525", "AutoPos8526", "AutoPos8527", "AutoBoth",
    "ScTypeDBShortPos", "ScTypeDBFullPos", "scCATCHPos", "CellMarkerPos",
    "PanglaoDB"
] %}
[CellTypeAnnotation_Hitype_{{m}}.envs.hitype]
db = "MarkerTraining_gse96583-output/HitypeWeightTrainer_{{m}}/gse96583_train.hitype.tsv"
norm = "weight"
use_sensitivity = false
{% endfor %}
