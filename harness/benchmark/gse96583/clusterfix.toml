# --------------------------------------------------------------------------
# WHAT   Repair config #1: the 54 cluster-level arms, each declaring ident at ARM level
#        (envs.ident = "RNA_snn_res.0.5"). Pipeline name CellTypeAnnotation_gse96583_clusterfix
#        so nothing on disk is overwritten.
# REVIEW Section 6 keying repair / Figure 3. Pairs with clusterfix-gse96583.py.
# SOURCE harness/benchmark/gse96583/clusterfix.toml
# --------------------------------------------------------------------------
# simpleconf-loader: liq
# Scoped-run config for the cluster-mapping fix on gse96583: the 54 cluster-level arms
# (ScType, scCATCH, scSorter, ScInfeR, SCSA -- every arm that declares an `ident`), driven
# by
#   uv run src/cell_type_annotation/clusterfix-gse96583.py @benchmark/gse96583/clusterfix.toml
#
# The defect (workspace-docs/CLUSTER-MAPPING-DEFECT.md): data-prep.R loops FindClusters over
# 7 resolutions, so `seurat_clusters` is an alias for the LAST one (1.5 -> 32 clusters),
# while benchmark/gse96583/eval.toml expands the labels over `RNA_snn_res.0.5` (24 clusters).
# eval.py matches cluster ids as strings, so a label written for the res-1.5 partition lands
# on a different cell group. Every cluster-level arm below therefore declares `ident` at ARM
# level (envs.ident -- the level the tool templates read for the identity column; putting it
# under envs.<tool>.ident would be silently ignored) and points it at the column the
# evaluation actually uses.
#
# `name` is distinct from every existing pipeline, so nothing on disk is overwritten:
#   CellTypeAnnotation_gse96583_test-output           <- pre-fix run (32-cluster tables), kept
#   CellTypeAnnotation_gse96583_maca_scsa_scaleout    <- MACA/SCSA scale-out (32-cluster SCSA
#                                                        tables), kept
#
# `python` is required for SCSA: the harness's uv venv has no scanpy/anndata; point it at an
# interpreter that does (see README, "Configuration").
name = "CellTypeAnnotation_gse96583_clusterfix"
error_strategy = "ignore"

[InputData.in]
infile = "benchmark/gse96583/data/gse96583_test.qs"

{% for m in [
    "ScTypeDBShort",
    "ScTypeDBFull",
    "scCATCH",
    "CellMarker",
    "AutoPos8525",
    "AutoPos8526",
    "AutoPos8527",
    "AutoBoth",
    "ScTypeDBShortPos",
    "ScTypeDBFullPos",
    "scCATCHPos",
    "CellMarkerPos",
    "PanglaoDB",
] %}
[CellTypeAnnotation_ScType_{{m}}.envs]
ident = "RNA_snn_res.0.5"

[CellTypeAnnotation_ScType_{{m}}.envs.sctype]
db = "MarkerTraining_gse96583-output/HitypeWeightTrainer_{{m}}/gse96583_train.hitype.tsv"

[CellTypeAnnotation_scCATCH_{{m}}.envs]
ident = "RNA_snn_res.0.5"

[CellTypeAnnotation_scCATCH_{{m}}.envs.sccatch]
tissue = "Blood"
marker = "MarkerTraining_gse96583-output/HitypeWeightTrainer_{{m}}/gse96583_train.hitype.tissue.tsv"

[CellTypeAnnotation_scSorter_{{m}}.envs]
ident = "RNA_snn_res.0.5"

[CellTypeAnnotation_scSorter_{{m}}.envs.scsorter]
db = "MarkerTraining_gse96583-output/HitypeWeightTrainer_{{m}}/gse96583_train.hitype.pos.tsv#cell_type,gene"

[CellTypeAnnotation_SCSA_{{m}}.envs]
ident = "RNA_snn_res.0.5"

[CellTypeAnnotation_SCSA_{{m}}.envs.scsa]
db = "MarkerTraining_gse96583-output/HitypeWeightTrainer_{{m}}/gse96583_train.hitype.tsv"
python = "python3"   # CONFIGURE: an interpreter with scanpy/anndata + MACA/SCSA (README, "Configuration")

{% endfor %}

{% for m in ["ScTypeDBFull", "CellMarker"] %}
[CellTypeAnnotation_ScInfeR_{{m}}.envs]
ident = "RNA_snn_res.0.5"

[CellTypeAnnotation_ScInfeR_{{m}}.envs.scinfer]
db = "MarkerTraining_gse96583-output/HitypeWeightTrainer_{{m}}/gse96583_train.hitype.tsv"
reduction = "umap"

{% endfor %}
